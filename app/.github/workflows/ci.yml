name: Farmer AI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================================
  # QUALITY GATES
  # ========================================================================
  
  quality-evaluation:
    name: Evaluate RAG Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Start Ollama (background)
        run: |
          # Note: In CI, you might mock LLM or use a smaller model
          # For now, we'll use a pre-built evaluation dataset
          echo "Using evaluation dataset (LLM mocked in CI)"
      
      - name: Load evaluation dataset
        run: |
          python -m app.eval.build_eval_dataset
      
      - name: Run retrieval evaluation
        run: |
          python -m app.eval.evaluate_retrieval \
            --output data/eval/results/ci_retrieval.json
      
      - name: Run generation evaluation (RAGAS)
        run: |
          python -m app.eval.ragas_eval \
            --output data/eval/results/ci_generation.json
      
      - name: Check quality thresholds
        run: |
          python scripts/check_quality_gates.py \
            --retrieval-file data/eval/results/ci_retrieval.json \
            --generation-file data/eval/results/ci_generation.json \
            --min-recall 0.60 \
            --min-mrr 0.50 \
            --min-rouge 0.45
        
        # This script will exit with code 1 if metrics drop below threshold
        # Preventing merge until quality is fixed
  
  # ========================================================================
  # PROMPT VALIDATION
  # ========================================================================
  
  prompt-validation:
    name: Validate Prompts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate YAML syntax
        run: |
          python -c "import yaml; yaml.safe_load(open('app/config/prompts.yaml'))"
      
      - name: Check prompts are versioned
        run: |
          if ! grep -q "Version:" app/config/prompts.yaml; then
            echo "Error: Prompts must have a Version field"
            exit 1
          fi
      
      - name: Ensure no hardcoded prompts
        run: |
          # Check that orchestrator uses config prompts
          if grep -q "You are a farming assistant\." app/core/orchestrator.py; then
            echo "Error: Hardcoded prompts found in orchestrator.py"
            echo "Use prompts from app/config/prompts.yaml instead"
            exit 1
          fi
  
  # ========================================================================
  # UNIT TESTS
  # ========================================================================
  
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run tests
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
  
  # ========================================================================
  # LINTING & CODE QUALITY
  # ========================================================================
  
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install linters
        run: |
          pip install black pylint flake8
      
      - name: Run Black (code formatter)
        run: black app/ --check
      
      - name: Run Flake8
        run: flake8 app/ --max-line-length=100
  
  # ========================================================================
  # SECURITY CHECKS
  # ========================================================================
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install bandit
        run: pip install bandit
      
      - name: Run Bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        run: |
          pip install safety
          safety check --json
        continue-on-error: true
  
  # ========================================================================
  # DOCKER BUILD
  # ========================================================================
  
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [quality-evaluation, tests, lint]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  # ========================================================================
  # NOTIFY ON FAILURE
  # ========================================================================
  
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [quality-evaluation]
    if: failure()
    
    steps:
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Quality evaluation failed. Please check:\n\n- RAG recall and MRR scores\n- Generation quality metrics\n- Prompt configuration'
            })