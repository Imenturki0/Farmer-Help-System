version: '3.9'

# ============================================================================
# PRODUCTION DOCKER-COMPOSE CONFIGURATION
# Farmer AI Assistant - All Services
# ============================================================================

services:
  # ========================================================================
  # LLM INFERENCE - Ollama
  # ========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: farmer-ai-ollama
    
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Port mapping
    ports:
      - "11434:11434"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Volumes for model persistence
    volumes:
      - ollama_data:/root/.ollama
    
    # Environment
    environment:
      - OLLAMA_DEBUG=false
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - farmer-ai-network


  # ========================================================================
  # VECTOR DATABASE - Qdrant
  # ========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: farmer-ai-qdrant
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    
    ports:
      - "6333:6333"
      - "6334:6334"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    volumes:
      - qdrant_data:/qdrant/storage
    
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-admin-key}
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - farmer-ai-network


  # ========================================================================
  # MONITORING - Langfuse (Optional)
  # ========================================================================
  langfuse:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: farmer-ai-langfuse
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    ports:
      - "3000:3000"
    
    depends_on:
      - postgres
    
    environment:
      # Database
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-your-secret-key}
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - farmer-ai-network


  # ========================================================================
  # DATABASE - PostgreSQL (For Langfuse)
  # ========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: farmer-ai-postgres
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    ports:
      - "5432:5432"
    
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - farmer-ai-network


  # ========================================================================
  # APPLICATION - Farmer AI API
  # ========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: farmer-ai-api
    
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    ports:
      - "8000:8000"
    
    # Depends on services
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    
    # Environment configuration
    environment:
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: production
      
      # LLM
      LLM_MODEL_NAME: llama3
      LLM_MODEL_PATH: http://ollama:11434
      LLM_TEMPERATURE: 0.7
      LLM_INFERENCE_TIMEOUT: 30
      
      # RAG
      RAG_EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      RAG_RETRIEVAL_K: 10
      RAG_FINAL_K: 5
      RAG_RETRIEVAL_THRESHOLD: 0.3
      
      # Observability
      OBSERVABILITY_LOG_LEVEL: INFO
      OBSERVABILITY_LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      OBSERVABILITY_LANGFUSE_HOST: http://langfuse:3000
      OBSERVABILITY_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      OBSERVABILITY_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    
    # Volume mounts
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./app/config:/app/app/config
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=api"
    
    networks:
      - farmer-ai-network


  # ========================================================================
  # REVERSE PROXY - Nginx (Optional)
  # ========================================================================
  nginx:
    image: nginx:alpine
    container_name: farmer-ai-nginx
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    
    depends_on:
      - api
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - farmer-ai-network


# ============================================================================
# NETWORKS
# ============================================================================
networks:
  farmer-ai-network:
    driver: bridge


# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  ollama_data:
    driver: local
  
  qdrant_data:
    driver: local
  
  postgres_data:
    driver: local


# ============================================================================
# USEFUL COMMANDS
# ============================================================================

# Start all services:
# docker-compose -f docker-compose.prod.yml up -d

# Check status:
# docker-compose -f docker-compose.prod.yml ps

# View logs:
# docker-compose -f docker-compose.prod.yml logs -f api

# Stop all services:
# docker-compose -f docker-compose.prod.yml down

# Pull latest models:
# docker-compose -f docker-compose.prod.yml exec ollama ollama pull llama3

# Scale API service:
# docker-compose -f docker-compose.prod.yml up -d --scale api=3

# Remove volumes (WARNING - data loss):
# docker-compose -f docker-compose.prod.yml down -v